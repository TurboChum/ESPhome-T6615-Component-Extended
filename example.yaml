substitutions:
  device_name: co2-sensor
  friendly_name: "CO2 Sensor"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

# ----- External component -----
external_components:
  - source:
      type: git
      url: https://github.com/TurboChum/ESPhome-T6615-Component-Extended
      ref: DEV
    components: [t6615]

# ----- UART bus -----
uart:
  id: uart_bus
  baud_rate: 19200
  rx_pin: GPIO16
  tx_pin: GPIO17

# ----- T6615 component -----
t6615:
  id: my_t6615
  uart_id: uart_bus
  update_interval: 60s

# ----- CO2 and elevation (read-only) -----
sensor:
  - platform: t6615
    t6615_id: my_t6615
    co2:
      name: "CO2"
    elevation_reading:
      name: "Elevation (stored)"

# ----- Firmware / serial info -----
text_sensor:
  - platform: t6615
    t6615_id: my_t6615
    serial_number:
      name: "Serial Number"
    firmware_version:
      name: "Firmware Version (COMPILE_SUBVOL)"
    firmware_date:
      name: "Firmware Date (COMPILE_DATE)"
    selftest_result:
      name: "Self-test Result"

# ----- Status flags -----
binary_sensor:
  - platform: t6615
    t6615_id: my_t6615
    error_flag:
      name: "Sensor Error"
    warmup_flag:
      name: "Sensor Warming Up"
    calibrating_flag:
      name: "Calibrating"
    selftest_running:
      name: "Self-test Running"

# ----- Switches -----
switch:
  - platform: t6615
    t6615_id: my_t6615
    idle_mode:
      name: "Idle Mode (lamp off)"
    # Must be turned ON before trigger_calibration button works.
    # Auto-disarms after 5 minutes or immediately after calibration fires.
    # NOTE: T6615 self-calibrates internally. Only use single-point
    # calibration with a certified reference gas at the target PPM.
    calibration_armed:
      name: "Calibration Armed"
    # ABC logic — only meaningful on T6613 (unreferenced single-beam).
    # Has no effect on T6615 which uses a sealed reference channel.
    abc_logic:
      name: "ABC Logic (T6613 only)"

# ----- Action buttons -----
button:
  - platform: t6615
    t6615_id: my_t6615
    warm_reset:
      name: "Warm Reset"
    # Requires: calibration_armed switch ON + not in warmup + not in error.
    # Set calibration_ppm_target number first. Reference gas must be flowing.
    trigger_calibration:
      name: "Trigger Single-Point Calibration"
    # Safe diagnostic — takes ~32 seconds, results in selftest_result sensor.
    self_test:
      name: "Run Self-Test"

# ----- Writable numbers -----
number:
  - platform: t6615
    t6615_id: my_t6615
    elevation:
      name: "Elevation (set)"
    # Set this BEFORE pressing trigger_calibration.
    calibration_ppm_target:
      name: "Calibration PPM Target"
